name: pttkhdt-steam

services:
  maildev:
    container_name: steam-maildev
    image: maildev/maildev:latest
    command: ["maildev", "--smtp", "1025", "--web", "1080"]
    ports:
      - "1080:1080"
      - "1025:1025"
    restart: unless-stopped

  db:
    container_name: steam-db
    image: mysql:8.0.44
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-270106}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-steam_store}
      MYSQL_USER: ${MYSQL_USER:-steam_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-270106}
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql/steam_store_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/sql/steam_store_sample_data.sql:/docker-entrypoint-initdb.d/02-sample.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -u root -p$${MYSQL_ROOT_PASSWORD} -e 'SELECT 1 FROM steam_store.GAME LIMIT 1;' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 25
      start_period: 20s
    restart: unless-stopped

  backend:
    container_name: steam-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-steam_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-270106}
      DB_NAME: ${MYSQL_DATABASE:-steam_store}
      DB_POOL_SIZE: 10
      CORS_ORIGIN: "http://localhost:5173,http://localhost:80,http://127.0.0.1:5173,http://127.0.0.1:80"
      STORAGE_LOCAL_DIR: /app/storage
      JWT_SECRET: ${JWT_SECRET:-steam-store-jwt-secret-key-32chars-min!}
      JWT_EXPIRES_IN: 24h
      SMTP_HOST: maildev
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: "Vortex Gaming <no-reply@vortex.local>"
    ports:
      - "3000:3000"
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/database').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  frontend:
    container_name: steam-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
