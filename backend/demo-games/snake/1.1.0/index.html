<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rắn Săn Mồi — Demo 1.1.0</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #18120e; color: #fff5eb; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(560px, calc(100% - 32px)); padding: 40px; border: 1px solid #6b432b; border-radius: 20px; background: #2b1d15; text-align: center; }
    .mark { color: #ffac63; font-size: 56px; }
    p { color: #e0c3a9; }
    small { color: #ffac63; font-weight: 700; letter-spacing: .12em; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">●</div>
    <small>DEMO BUILD 1.1.0</small>
    <h1>Rắn Săn Mồi Cổ Điển</h1>
    <p>Game demo đang chạy. Bản vá 1.1.0 dùng màn hình giả lập, chưa có gameplay.</p>
  </main>
</body>
</html>
