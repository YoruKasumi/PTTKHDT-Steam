<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dò Mìn Cổ Điển — Demo</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #15151a; color: #f7f4ed; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(560px, calc(100% - 32px)); padding: 40px; border: 1px solid #5a5141; border-radius: 20px; background: #26231e; text-align: center; }
    .mark { color: #f3c86a; font-size: 56px; }
    p { color: #d3cbbb; }
    small { color: #f3c86a; font-weight: 700; letter-spacing: .12em; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✦</div>
    <small>DEMO BUILD 1.0.0</small>
    <h1>Dò Mìn Cổ Điển</h1>
    <p>Game demo đang chạy. Đây là màn hình giả lập, chưa có gameplay.</p>
  </main>
</body>
</html>
