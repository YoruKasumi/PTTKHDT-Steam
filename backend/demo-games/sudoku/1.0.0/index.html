<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku Trí Tuệ — Demo</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #111426; color: #f0f2ff; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(560px, calc(100% - 32px)); padding: 40px; border: 1px solid #3b4374; border-radius: 20px; background: #1b2040; text-align: center; }
    .mark { color: #b4a1ff; font-size: 56px; }
    p { color: #c4c8e3; }
    small { color: #b4a1ff; font-weight: 700; letter-spacing: .12em; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">▦</div>
    <small>DEMO BUILD 1.0.0</small>
    <h1>Sudoku Trí Tuệ</h1>
    <p>Game demo đang chạy. Đây là màn hình giả lập, chưa có gameplay.</p>
  </main>
</body>
</html>
