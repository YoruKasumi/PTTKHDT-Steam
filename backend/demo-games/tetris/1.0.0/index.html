<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xếp Gạch Tetris — Demo</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #10131d; color: #eef2ff; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(560px, calc(100% - 32px)); padding: 40px; border: 1px solid #343b55; border-radius: 20px; background: #191e2d; text-align: center; }
    .mark { color: #8b9cff; font-size: 56px; }
    p { color: #b7bfd7; }
    small { color: #8b9cff; font-weight: 700; letter-spacing: .12em; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">▦</div>
    <small>DEMO BUILD 1.0.0</small>
    <h1>Xếp Gạch Tetris</h1>
    <p>Game demo đang chạy. Đây là màn hình giả lập, chưa có gameplay.</p>
  </main>
</body>
</html>
